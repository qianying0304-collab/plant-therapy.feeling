<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>植物靈魂特質測驗｜感官植療所</title>
  <link rel="stylesheet" href="style.css?v=9">
  <style>
    /* 全局層級校正與遮擋問題修復 */
    body {
      position: relative;
      overflow-x: hidden;
    }

    /* 測驗頁面的核心版面與卡片樣式 */
    .quiz-wrapper {
      position: relative !important;
      z-index: 10 !important;
      padding-top: 120px;
      padding-bottom: 60px;
      min-height: calc(100vh - 70px);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .quiz-wrapper::before,
    .quiz-wrapper::after,
    .quiz-container::before,
    .quiz-container::after {
      display: none !important;
      content: none !important;
    }

    .quiz-container {
      width: 100%;
      max-width: 620px;
      margin: 0 auto;
      padding: 36px 32px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 12px 32px rgba(52, 66, 56, 0.08);
      border: 1px solid #e8e3d9;
      text-align: center;
      position: relative;
      z-index: 15;
    }

    .progress-bar {
      height: 6px;
      background: #f0ece1;
      border-radius: 10px;
      margin-bottom: 24px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 10%;
      background: #657762;
      transition: width 0.35s ease-in-out;
    }

    .question-step {
      font-size: 13px;
      font-weight: 700;
      color: #8b765e;
      letter-spacing: 2px;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .question-title {
      font-size: 20px;
      font-weight: 700;
      color: #344238;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      padding: 14px 18px;
      border: 1.5px solid #e2ded4;
      background: #faf8f5;
      border-radius: 12px;
      color: #344238;
      font-size: 14.5px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
      line-height: 1.45;
    }

    .option-btn:hover {
      border-color: #657762;
      background: #ffffff;
      box-shadow: 0 4px 12px rgba(101, 119, 98, 0.12);
      transform: translateY(-1px);
    }

    .result-box {
      display: none;
    }

    .result-icon {
      font-size: 56px;
      margin-bottom: 12px;
    }

    .result-title {
      font-size: 22px;
      color: #344238;
      margin-bottom: 16px;
      font-weight: 700;
    }

    .result-desc {
      font-size: 14.5px;
      color: #4a5749;
      line-height: 1.7;
      margin-bottom: 28px;
      text-align: left;
      background: #f9f8f3;
      padding: 20px 22px;
      border-radius: 14px;
      border: 1px solid #eae5db;
    }

    .result-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-action {
      display: inline-block;
      padding: 12px 20px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
    }

    .btn-main {
      background: #657762;
      color: #ffffff;
    }

    .btn-main:hover {
      background: #4f5f4d;
    }

    .btn-secondary {
      background: #e2ded4;
      color: #344238;
    }

    .btn-secondary:hover {
      background: #d0c9bd;
    }
  </style>
</head>
<body>

<header class="navbar">
  <a href="index.html" class="logo-brand">
    <span class="logo-title">感官植療所</span>
  </a>
  <nav>
    <a href="index.html#home">首頁</a>
    <a href="index.html#concept">理念</a>
    <a href="index.html#plants">植物角色</a>
    <a href="product.html">產品</a>
    <a href="index.html#experience">感官體驗</a>
    <a href="index.html#story">我們的故事</a>
    <a href="quiz.html" class="active">靈魂測驗</a>
  </nav>
</header>

<main class="quiz-wrapper">
  <div class="quiz-container">
    <!-- 測驗進行區 -->
    <div id="quiz-box">
      <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
      <div id="question-number" class="question-step">QUESTION 01 / 10</div>
      <h2 class="question-title" id="question-text">載入中...</h2>
      <div class="options-grid" id="options-container"></div>
    </div>

    <!-- 測驗結果區 -->
    <div id="result-box" class="result-box">
      <div class="result-icon" id="res-icon">🪴</div>
      <div style="font-size: 13px; color: #8b765e; letter-spacing: 2px; font-weight: 700; margin-bottom: 6px;">YOUR PLANT SOUL</div>
      <h2 class="result-title" id="res-title">你的植物夥伴</h2>
      <div class="result-desc" id="res-desc">說明文字...</div>
      
      <div class="result-actions">
        <button onclick="restartQuiz()" class="btn-action btn-secondary">🔄 再測一次</button>
        <a href="index.html#plants" class="btn-action btn-main">🌿 查看植物角色</a>
        <a href="index.html" class="btn-action btn-secondary">🏠 返回首頁</a>
      </div>
    </div>
  </div>
</main>

<script>
  const questions = [
    {
      q: "1. 結束忙碌的一天回到家，你的第一反應是？",
      options: [
        { text: "戴上耳機，享受完全安靜的獨處時光", key: "tiger" },
        { text: "檢視今日收穫，順手整理明日待辦事項", key: "pachira" },
        { text: "點燃香氛、聽音樂，激發靈感與想像", key: "rosemary" },
        { text: "躺在沙發上隨性滑影片，放空休息", key: "coin" },
        { text: "泡杯熱茶深呼吸，釋放累積的壓力", key: "peace" },
        { text: "打給朋友聊天，分享今天發生的趣事", key: "basil" }
      ]
    },
    {
      q: "2. 當你身心疲憊時，哪種場景最能幫你充電？",
      options: [
        { text: "簡約安全的私人房間，不受外人打擾", key: "tiger" },
        { text: "充滿條理的工作桌，看著目標逐漸達成", key: "pachira" },
        { text: "陽光灑落、散發草本香氣的自然花園", key: "rosemary" },
        { text: "熱鬧有趣、隨時有驚喜的文創市集", key: "coin" },
        { text: "綠意環繞、寧靜平和的山林秘境", key: "peace" },
        { text: "氣氛熱絡、充滿歡笑的友人聚會", key: "basil" }
      ]
    },
    {
      q: "3. 面對突如其來的計畫變更，你的反應是？",
      options: [
        { text: "保持冷靜沉穩，堅定應對不慌張", key: "tiger" },
        { text: "快速評估利弊，尋找最有效益的備案", key: "pachira" },
        { text: "敏銳察覺變化，從中尋找新靈感", key: "rosemary" },
        { text: "隨遇而安，相信船到橋頭自然直", key: "coin" },
        { text: "先撫平情緒，以溫柔平和的心態面對", key: "peace" },
        { text: "主動找夥伴討論，集思廣益解決問題", key: "basil" }
      ]
    },
    {
      q: "4. 在朋友或團隊眼中，你通常是什麼角色？",
      options: [
        { text: "冷靜獨立的依靠，給人滿滿安全感", key: "tiger" },
        { text: "務實可靠的大佬，引領大家達成目標", key: "pachira" },
        { text: "靈感源源不絕的智囊，給予獨到見解", key: "rosemary" },
        { text: "隨和圓融的幸運星，帶給周遭好運", key: "coin" },
        { text: "溫暖包容的傾聽者，撫慰大家的焦慮", key: "peace" },
        { text: "熱情活潑的氣氛帶動者，絕不冷場", key: "basil" }
      ]
    },
    {
      q: "5. 你理想中的空間佈置風格是？",
      options: [
        { text: "簡約俐落、獨立私密的質感空間", key: "tiger" },
        { text: "沉穩大氣、富有價值的木質植物風", key: "pachira" },
        { text: "擺滿書籍與手作香氛的靈感角落", key: "rosemary" },
        { text: "圓潤可愛、充滿生活樂趣的小天地", key: "coin" },
        { text: "純淨採光、無壓力的平靜避風港", key: "peace" },
        { text: "熱鬧有溫度、方便隨時招待朋友的空間", key: "basil" }
      ]
    },
    {
      q: "6. 面對生活中的壓力，你習慣怎麼釋放？",
      options: [
        { text: "自我淨化消化，獨自重新站穩腳步", key: "tiger" },
        { text: "轉化為行動力，透過解決問題找回掌控感", key: "pachira" },
        { text: "透過寫作、創作或興趣抒發情緒", key: "rosemary" },
        { text: "吃頓美食、睡個好覺，順其自然就好", key: "coin" },
        { text: "冥想放鬆，允許自己暫時休息喘息", key: "peace" },
        { text: "找信任的朋友大聊一場，釋放情緒", key: "basil" }
      ]
    },
    {
      q: "7. 你最認同哪一種生活哲學？",
      options: [
        { text: "保有獨立自我，堅定守護心中信念", key: "tiger" },
        { text: "腳踏實地耕耘，讓努力開花結果", key: "pachira" },
        { text: "保持好奇直覺，隨時捕捉生活靈感", key: "rosemary" },
        { text: "圓滿自在，順應自然就是最大幸運", key: "coin" },
        { text: "內心平靜溫柔，感受歲月靜好", key: "peace" },
        { text: "熱情分享真誠，用渲染力點亮日常", key: "basil" }
      ]
    },
    {
      q: "8. 當你走進一個新環境，你最希望為它帶來什麼感覺？",
      options: [
        { text: "明確的安全界線與專注氛圍", key: "tiger" },
        { text: "穩重專業與有價值的氣場", key: "pachira" },
        { text: "清新且令人激發思考的氣息", key: "rosemary" },
        { text: "親切溫馨、沒有壓力的舒適感", key: "coin" },
        { text: "柔和平靜、能讓人安心的氣氛", key: "peace" },
        { text: "歡樂熱情、充滿生機的生活氣息", key: "basil" }
      ]
    },
    {
      q: "9. 當身邊朋友獲得成功時，你的第一想法是？",
      options: [
        { text: "默默在背後給予最穩固的支持", key: "tiger" },
        { text: "受到鼓舞，自己也要按部就班實現目標", key: "pachira" },
        { text: "為對方的獨特感到高興，並交流新觀點", key: "rosemary" },
        { text: "覺得大家都很順利圓滿，共享這份好運", key: "coin" },
        { text: "由衷感到平靜祝福，給予溫暖擁抱", key: "peace" },
        { text: "超級興奮！第一時間舉杯為對方熱烈慶祝", key: "basil" }
      ]
    },
    {
      q: "10. 如果用一個詞形容你最近理想的生活狀態，那是：",
      options: [
        { text: "獨立堅韌，不隨波逐流", key: "tiger" },
        { text: "踏實累積，成果蓬勃發展", key: "pachira" },
        { text: "思緒敏銳，靈感源源不絕", key: "rosemary" },
        { text: "輕盈彈性，順應各種變化", key: "coin" },
        { text: "清澈平靜，減少無謂紛擾", key: "peace" },
        { text: "熱情連結，充滿互動與溫度", key: "basil" }
      ]
    }
  ];

  const plantResults = {
    tiger: {
      name: "白芋虎尾蘭",
      icon: "🪴",
      desc: "【堅定守護 ✕ 冷靜沉穩】<br>你擁有強大的內心與獨立氣場。就像白芋虎尾蘭一樣，能淨化周圍的喧囂，給身邊的人帶來滿滿的安全感。"
    },
    pachira: {
      name: "馬拉巴栗",
      icon: "🌳",
      desc: "【事業財富 ✕ 踏實圓融】<br>你是一位務實且具備遠見的行動者。像馬拉巴栗般根基紮實、展現旺盛生命力，總能在生活中穩健前行。"
    },
    rosemary: {
      name: "迷迭香",
      icon: "🌿",
      desc: "【智慧靈感 ✕ 敏銳記憶】<br>你具備細膩的觀察力與豐富直覺。如同迷迭香清新的草本香氣，總能喚醒身邊人的記憶與靈光一閃的創造力。"
    },
    coin: {
      name: "銅錢草",
      icon: "☘️",
      desc: "【幸福圓滿 ✕ 隨遇而安】<br>你擁有極強的適應力與樂觀心態。像銅錢草般葉片圓潤，不論身處什麼環境都能蓬勃生長，帶來幸運與圓滿。"
    },
    peace: {
      name: "白鶴芋",
      icon: "🪷",
      desc: "【心靈平靜 ✕ 溫柔包容】<br>你內心渴望和諧，具備極高同理心。就像白鶴芋純潔的花朵，能撫平焦慮與不安，用溫柔的力量帶來寧靜。"
    },
    basil: {
      name: "羅勒",
      icon: "🌱",
      desc: "【熱情陪伴 ✕ 人際連結】<br>你充滿熱情與生活煙火氣。如同料理中不可或缺的羅勒香氣，只要有你在的地方就充滿活力與歡笑。"
    }
  };

  let currentQuestion = 0;
  let scores = { tiger: 0, pachira: 0, rosemary: 0, coin: 0, peace: 0, basil: 0 };

  function renderQuestion() {
    const qData = questions[currentQuestion];
    document.getElementById('question-number').innerText = `QUESTION ${String(currentQuestion + 1).padStart(2, '0')} / 10`;
    document.getElementById('question-text').innerText = qData.q;
    document.getElementById('progress').style.width = `${((currentQuestion + 1) / 10) * 100}%`;

    const container = document.getElementById('options-container');
    container.innerHTML = '';

    qData.options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.innerText = opt.text;
      btn.onclick = () => handleSelect(opt.key);
      container.appendChild(btn);
    });
  }

  function handleSelect(key) {
    scores[key] += 1;
    currentQuestion++;
    if (currentQuestion < questions.length) {
      renderQuestion();
    } else {
      showResult();
    }
  }

  function showResult() {
    document.getElementById('quiz-box').style.display = 'none';
    document.getElementById('result-box').style.display = 'block';

    let maxPlant = 'tiger';
    let maxScore = -1;
    for (let key in scores) {
      if (scores[key] > maxScore) {
        maxScore = scores[key];
        maxPlant = key;
      }
    }

    const res = plantResults[maxPlant];
    document.getElementById('res-icon').innerText = res.icon;
    document.getElementById('res-title').innerText = `你的靈魂植物夥伴：${res.name}`;
    document.getElementById('res-desc').innerHTML = res.desc;
  }

  function restartQuiz() {
    currentQuestion = 0;
    scores = { tiger: 0, pachira: 0, rosemary: 0, coin: 0, peace: 0, basil: 0 };
    document.getElementById('result-box').style.display = 'none';
    document.getElementById('quiz-box').style.display = 'block';
    renderQuestion();
  }

  renderQuestion();
</script>

</body>
</html>
